<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Issue Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #172b4d;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #dfe1e6;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0052cc;
            color: white;
        }

        .btn-primary:hover {
            background: #0043a0;
        }

        .btn-secondary {
            background: #f1f2f4;
            color: #172b4d;
        }

        .btn-secondary:hover {
            background: #dfe1e6;
        }

        .container {
            display: flex;
            height: calc(100vh - 56px);
        }

        .sidebar {
            width: 240px;
            background: #fff;
            border-right: 1px solid #dfe1e6;
            padding: 20px 12px;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #626f86;
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .sidebar-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #172b4d;
            transition: background 0.2s;
        }

        .sidebar-item:hover {
            background: #f1f2f4;
        }

        .sidebar-item.active {
            background: #deebff;
            color: #0052cc;
            font-weight: 500;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-header {
            padding: 20px 24px;
            background: #f5f7fa;
            border-bottom: 1px solid #dfe1e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-input {
            padding: 8px 12px;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            font-size: 14px;
            min-width: 200px;
        }

        .board {
            display: flex;
            gap: 16px;
            padding: 20px 24px;
            overflow-x: auto;
            flex: 1;
        }

        .column {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            background: #f5f7fa;
            border-radius: 4px;
            overflow: hidden;
        }

        .column-header {
            padding: 12px 16px;
            background: #fff;
            border-bottom: 2px solid #dfe1e6;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-count {
            background: #f1f2f4;
            color: #626f86;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .cards {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #fff;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            padding: 12px;
            cursor: move;
            transition: all 0.2s;
            user-select: none;
        }

        .card:hover {
            box-shadow: 0 1px 4px rgba(9, 30, 66, 0.13);
        }

        .card.dragging {
            opacity: 0.5;
        }

        .card-key {
            font-size: 11px;
            font-weight: 600;
            color: #626f86;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #172b4d;
            word-break: break-word;
        }

        .card-fields {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            color: #626f86;
        }

        .card-field {
            display: flex;
            justify-content: space-between;
        }

        .card-severity {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
            width: fit-content;
        }

        .severity-critical {
            background: #ffeceb;
            color: #ae2a19;
        }

        .severity-high {
            background: #ffeceb;
            color: #d97706;
        }

        .severity-medium {
            background: #fffacd;
            color: #f59e0b;
        }

        .severity-low {
            background: #ecf5ff;
            color: #0052cc;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(9, 30, 66, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 4px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(9, 30, 66, 0.15);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #dfe1e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #626f86;
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #172b4d;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0052cc;
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #dfe1e6;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .status-loading {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            color: #626f86;
            box-shadow: 0 1px 4px rgba(9, 30, 66, 0.13);
            display: none;
        }

        .status-loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #dfe1e6;
            border-top-color: #0052cc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #626f86;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            color: #172b4d;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-form input {
            padding: 12px;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .login-form input:focus {
            outline: none;
            border-color: #0052cc;
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.1);
        }

        .login-form button {
            padding: 12px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .login-form button:hover {
            background: #0043a0;
        }

        .login-error {
            color: #ae2a19;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: flex;
            width: 100%;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .user-menu span {
            color: #626f86;
        }

        .btn-logout {
            padding: 6px 12px;
            background: #ff5630;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #dd3a2b;
        }

        .btn-key {
            padding: 6px 12px;
            background: #36b37e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-key:hover {
            background: #2d9b67;
        }
    </style>
</head>
<body>
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h2>Issue Tracker</h2>
            <div class="login-form">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="off">
                <button onclick="trackerApp.login()">Sign In</button>
                <div class="login-error" id="loginError"></div>
            </div>
        </div>
    </div>

    <div id="dashboard" class="dashboard">
    <div class="header">
        <h1>🔧 Hardware Issue Tracker</h1>
        <div class="header-actions">
            <input type="text" id="searchInput" class="filter-input" placeholder="Search issues...">
            <button class="btn btn-primary" onclick="app.openCreateModal()">+ Create Issue</button>
            <button class="btn-key" onclick="trackerApp.generateKey()">🔑 Generate API Key</button>
            <div class="user-menu">
                <span id="currentUser"></span>
                <button class="btn-logout" onclick="trackerApp.logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Projects</div>
                <div class="sidebar-item active" onclick="app.selectProject('all')">All Issues</div>
                <div class="sidebar-item" onclick="app.selectProject('fw')">Firmware</div>
                <div class="sidebar-item" onclick="app.selectProject('rtl')">RTL Design</div>
                <div class="sidebar-item" onclick="app.selectProject('perf')">Performance</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Views</div>
                <div class="sidebar-item active" onclick="app.selectView('board')">Board</div>
                <div class="sidebar-item" onclick="app.selectView('list')">List</div>
            </div>
        </div>

        <div class="main">
            <div class="board-header">
                <div>
                    <h2>Active Sprint</h2>
                    <div style="font-size: 12px; color: #626f86; margin-top: 4px;">
                        <span id="issueCount">0</span> issues
                    </div>
                </div>
                <div class="filter-bar">
                    <select id="severityFilter" class="filter-input" style="min-width: auto;" onchange="app.applyFilters()">
                        <option value="">All Severities</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <div class="board">
                <div class="column">
                    <div class="column-header">
                        <span>To Do</span>
                        <span class="column-count" data-status="todo">0</span>
                    </div>
                    <div class="cards" data-status="todo" ondrop="app.handleDrop(event)" ondragover="app.handleDragOver(event)"></div>
                </div>

                <div class="column">
                    <div class="column-header">
                        <span>In Progress</span>
                        <span class="column-count" data-status="in-progress">0</span>
                    </div>
                    <div class="cards" data-status="in-progress" ondrop="app.handleDrop(event)" ondragover="app.handleDragOver(event)"></div>
                </div>

                <div class="column">
                    <div class="column-header">
                        <span>In Review</span>
                        <span class="column-count" data-status="in-review">0</span>
                    </div>
                    <div class="cards" data-status="in-review" ondrop="app.handleDrop(event)" ondragover="app.handleDragOver(event)"></div>
                </div>

                <div class="column">
                    <div class="column-header">
                        <span>Done</span>
                        <span class="column-count" data-status="done">0</span>
                    </div>
                    <div class="cards" data-status="done" ondrop="app.handleDrop(event)" ondragover="app.handleDragOver(event)"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Issue</h3>
                <button class="modal-close" onclick="app.closeCreateModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="createForm" onsubmit="app.handleCreateSubmit(event)">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="issueTitle" required placeholder="Brief description of the issue">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="issueDescription" placeholder="Detailed description (optional)"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Component</label>
                            <input type="text" id="issueComponent" placeholder="e.g., DDR Controller">
                        </div>
                        <div class="form-group">
                            <label>Hardware Revision</label>
                            <input type="text" id="issueRevision" placeholder="e.g., Rev A">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Firmware Version</label>
                            <input type="text" id="issueFirmware" placeholder="e.g., v1.2.3">
                        </div>
                        <div class="form-group">
                            <label>Severity</label>
                            <select id="issueSeverity" required>
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="app.closeCreateModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Issue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editModalTitle">Edit Issue</h3>
                <button class="modal-close" onclick="app.closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="editForm" onsubmit="app.handleEditSubmit(event)">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="editDescription"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Component</label>
                            <input type="text" id="editComponent">
                        </div>
                        <div class="form-group">
                            <label>Hardware Revision</label>
                            <input type="text" id="editRevision">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Firmware Version</label>
                            <input type="text" id="editFirmware">
                        </div>
                        <div class="form-group">
                            <label>Severity</label>
                            <select id="editSeverity" required>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status</label>
                            <select id="editStatus" required>
                                <option value="todo">To Do</option>
                                <option value="in-progress">In Progress</option>
                                <option value="in-review">In Review</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="app.deleteCurrentIssue()">Delete</button>
                        <div style="flex: 1;"></div>
                        <button type="button" class="btn btn-secondary" onclick="app.closeEditModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="status-loading" id="statusLoading">
        <span class="spinner"></span>
        <span>Syncing...</span>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        const POLL_INTERVAL = 2000;

        const app = {
            currentProject: 'all',
            currentView: 'board',
            issues: [],
            editingIssueId: null,
            searchQuery: '',
            severityFilter: '',
            draggedCard: null,

            async init() {
                await this.loadIssues();
                this.render();
                this.setupEventListeners();
                setInterval(() => this.syncIssues(), POLL_INTERVAL);
            },

            setupEventListeners() {
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value.toLowerCase();
                    this.applyFilters();
                });
            },

            async loadIssues() {
                try {
                    const response = await fetch(`${API_BASE}/issues`, {
                        headers: getAuthHeaders()
                    });
                    this.issues = await response.json();
                } catch (error) {
                    console.error('Failed to load issues:', error);
                }
            },

            async syncIssues() {
                const oldCount = this.issues.length;
                await this.loadIssues();
                if (this.issues.length !== oldCount) {
                    this.render();
                }
            },

            getFilteredIssues() {
                return this.issues.filter(issue => {
                    if (this.searchQuery && !issue.title.toLowerCase().includes(this.searchQuery) &&
                        !issue.component?.toLowerCase().includes(this.searchQuery)) {
                        return false;
                    }
                    if (this.severityFilter && issue.severity !== this.severityFilter) {
                        return false;
                    }
                    return true;
                });
            },

            render() {
                const filtered = this.getFilteredIssues();
                const grouped = {
                    'todo': [],
                    'in-progress': [],
                    'in-review': [],
                    'done': []
                };

                filtered.forEach(issue => {
                    if (grouped[issue.status]) {
                        grouped[issue.status].push(issue);
                    }
                });

                document.querySelectorAll('.cards').forEach(container => {
                    const status = container.dataset.status;
                    const issues = grouped[status];
                    container.innerHTML = '';

                    if (issues.length === 0) {
                        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">No issues</div></div>';
                        return;
                    }

                    issues.forEach(issue => {
                        const card = this.createCard(issue);
                        container.appendChild(card);
                    });
                });

                document.querySelectorAll('.column-count').forEach(count => {
                    const status = count.dataset.status;
                    count.textContent = grouped[status].length;
                });

                document.getElementById('issueCount').textContent = filtered.length;
            },

            createCard(issue) {
                const card = document.createElement('div');
                card.className = 'card';
                card.draggable = true;
                card.dataset.id = issue.id;

                const severityClass = `severity-${issue.severity}`;
                const revisionHtml = issue.revision ? `<div class="card-field"><span>Rev:</span><span>${issue.revision}</span></div>` : '';
                const fwHtml = issue.firmware ? `<div class="card-field"><span>FW:</span><span>${issue.firmware}</span></div>` : '';
                const componentHtml = issue.component ? `<div class="card-field"><span>Component:</span><span>${issue.component}</span></div>` : '';

                card.innerHTML = `
                    <div class="card-key">HW-${issue.id}</div>
                    <div class="card-title">${issue.title}</div>
                    <div class="card-fields">
                        ${componentHtml}
                        ${revisionHtml}
                        ${fwHtml}
                        <div style="margin-top: 4px;">
                            <span class="card-severity ${severityClass}">${issue.severity.toUpperCase()}</span>
                        </div>
                    </div>
                `;

                card.addEventListener('dragstart', (e) => this.handleDragStart(e, issue.id));
                card.addEventListener('click', (e) => this.openEditModal(issue.id));

                return card;
            },

            handleDragStart(e, issueId) {
                this.draggedCard = issueId;
                e.target.closest('.card').classList.add('dragging');
            },

            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            },

            async handleDrop(e) {
                e.preventDefault();
                const container = e.currentTarget;
                const newStatus = container.dataset.status;
                const issue = this.issues.find(i => i.id === this.draggedCard);

                if (issue && issue.status !== newStatus) {
                    issue.status = newStatus;
                    await this.updateIssue(issue);
                }

                document.querySelectorAll('.card.dragging').forEach(card => card.classList.remove('dragging'));
                this.draggedCard = null;
            },

            openCreateModal() {
                document.getElementById('createForm').reset();
                document.getElementById('createModal').classList.add('active');
            },

            closeCreateModal() {
                document.getElementById('createModal').classList.remove('active');
            },

            async handleCreateSubmit(e) {
                e.preventDefault();
                const newIssue = {
                    title: document.getElementById('issueTitle').value,
                    description: document.getElementById('issueDescription').value,
                    component: document.getElementById('issueComponent').value,
                    revision: document.getElementById('issueRevision').value,
                    firmware: document.getElementById('issueFirmware').value,
                    severity: document.getElementById('issueSeverity').value,
                    status: 'todo'
                };

                try {
                    this.showLoading();
                    const response = await fetch(`${API_BASE}/issues`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(newIssue)
                    });
                    await this.loadIssues();
                    this.render();
                    this.closeCreateModal();
                } catch (error) {
                    console.error('Failed to create issue:', error);
                    alert('Failed to create issue');
                } finally {
                    this.hideLoading();
                }
            },

            async openEditModal(issueId) {
                this.editingIssueId = issueId;
                const issue = this.issues.find(i => i.id === issueId);
                if (!issue) return;

                document.getElementById('editModalTitle').textContent = `Edit HW-${issue.id}`;
                document.getElementById('editTitle').value = issue.title;
                document.getElementById('editDescription').value = issue.description || '';
                document.getElementById('editComponent').value = issue.component || '';
                document.getElementById('editRevision').value = issue.revision || '';
                document.getElementById('editFirmware').value = issue.firmware || '';
                document.getElementById('editSeverity').value = issue.severity;
                document.getElementById('editStatus').value = issue.status;

                document.getElementById('editModal').classList.add('active');
            },

            closeEditModal() {
                document.getElementById('editModal').classList.remove('active');
                this.editingIssueId = null;
            },

            async handleEditSubmit(e) {
                e.preventDefault();
                const issue = this.issues.find(i => i.id === this.editingIssueId);
                if (!issue) return;

                issue.title = document.getElementById('editTitle').value;
                issue.description = document.getElementById('editDescription').value;
                issue.component = document.getElementById('editComponent').value;
                issue.revision = document.getElementById('editRevision').value;
                issue.firmware = document.getElementById('editFirmware').value;
                issue.severity = document.getElementById('editSeverity').value;
                issue.status = document.getElementById('editStatus').value;

                await this.updateIssue(issue);
                this.closeEditModal();
            },

            async updateIssue(issue) {
                try {
                    this.showLoading();
                    const response = await fetch(`${API_BASE}/issues/${issue.id}`, {
                        method: 'PUT',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(issue)
                    });
                    await this.loadIssues();
                    this.render();
                } catch (error) {
                    console.error('Failed to update issue:', error);
                    alert('Failed to update issue');
                } finally {
                    this.hideLoading();
                }
            },

            async deleteCurrentIssue() {
                if (!this.editingIssueId || !confirm('Delete this issue?')) return;

                try {
                    this.showLoading();
                    await fetch(`${API_BASE}/issues/${this.editingIssueId}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    await this.loadIssues();
                    this.render();
                    this.closeEditModal();
                } catch (error) {
                    console.error('Failed to delete issue:', error);
                    alert('Failed to delete issue');
                } finally {
                    this.hideLoading();
                }
            },

            applyFilters() {
                this.severityFilter = document.getElementById('severityFilter').value;
                this.render();
            },

            selectProject(project) {
                this.currentProject = project;
            },

            selectView(view) {
                this.currentView = view;
            },

            showLoading() {
                document.getElementById('statusLoading').classList.add('active');
            },

            hideLoading() {
                document.getElementById('statusLoading').classList.remove('active');
            }
        };

        function getAuthHeaders() {
            const sessionId = localStorage.getItem('sessionId');
            return {
                'Authorization': `Bearer ${sessionId}`,
                'Content-Type': 'application/json'
            };
        }

        const trackerApp = {
            async login() {
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;
                const errorDiv = document.getElementById('loginError');

                if (!username || !password) {
                    errorDiv.textContent = 'Please enter username and password';
                    errorDiv.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) {
                        errorDiv.textContent = 'Invalid username or password';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    const data = await response.json();
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('username', data.username);
                    this.showDashboard(data.username);
                } catch (error) {
                    errorDiv.textContent = 'Login failed: ' + error.message;
                    errorDiv.style.display = 'block';
                }
            },

            showDashboard(username) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                document.getElementById('currentUser').textContent = username;
                app.init();
            },

            async logout() {
                const sessionId = localStorage.getItem('sessionId');
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${sessionId}`
                        }
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
                localStorage.removeItem('sessionId');
                localStorage.removeItem('username');
                location.reload();
            },

            async generateKey() {
                const sessionId = localStorage.getItem('sessionId');
                try {
                    const response = await fetch('/api/generate-key', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${sessionId}`
                        }
                    });

                    if (!response.ok) {
                        alert('Failed to generate API key');
                        return;
                    }

                    const data = await response.json();
                    const apiKey = data.api_key;
                    alert(`API Key:\n\n${apiKey}\n\nUse in X-API-Key header`);
                    navigator.clipboard.writeText(apiKey).catch(err => console.error('Copy failed:', err));
                } catch (error) {
                    alert('Error generating API key: ' + error.message);
                }
            },

            init() {
                const sessionId = localStorage.getItem('sessionId');
                const username = localStorage.getItem('username');

                if (sessionId && username) {
                    this.showDashboard(username);
                } else {
                    document.getElementById('loginContainer').style.display = 'flex';
                }

                document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.login();
                });
            }
        };

        trackerApp.init();
    </script>
    </div>
</body>
